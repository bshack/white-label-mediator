name: Keep README current-state only

on:
  push:
    branches:
      - docs/remove-version-history-20260911
    paths:
      - .github/workflows/readme-current-state.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Remove release-history documentation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          text = p.read_text()
          removals = [
          """### Version 4 migration

Bower/AMD package metadata has been removed. Install `white-label-mediator` through npm and consume the documented CommonJS/ESM-compatible package entrypoint with a modern Node or browser-bundler toolchain. No Bower compatibility metadata is retained.

""",
          """This is a major release because the distribution is now CommonJS emitted by TypeScript, replacing the previous UMD wrapper. CommonJS `require` and the documented ESM imports remain supported. Direct AMD loading or browser script tags that depended on UMD globals must migrate to a browser bundler. Edit `src/*.ts`, then run `npm run build`; do not edit generated `dist` files. The obsolete Babel build dependencies have been removed.

""",
          """To undo this migration, revert its commit and run `npm ci` from the restored lockfile. No npm release, database migration, or production deployment is performed by these development changes.
"""
          ]
          for old in removals:
              if old not in text:
                  raise SystemExit('expected release-history text not found')
              text = text.replace(old, '')
          text = text.replace('Version 4.0.0 retains the standard synchronous EventEmitter behavior and has no runtime dependency on model, view, or router.', 'The package retains the standard synchronous EventEmitter behavior and has no runtime dependency on model, view, or router.')
          text = text.replace('Breaking public API or supported-distribution changes are communicated with a Semantic Versioning major release and documented migration notes.', 'Breaking public API or supported-distribution changes are communicated with a Semantic Versioning major release and migration notes outside this README.')
          p.write_text(text)
          PY
          if grep -En '^#{2,3} Version [0-9]+.*migration|Version [0-9]+\.[0-9]+\.[0-9]+|This is a major release|undo this migration' README.md; then
            echo 'README still contains project release-history prose.' >&2
            exit 1
          fi
      - name: Commit README
        run: |
          git add README.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Keep README focused on current Mediator API'
          git push

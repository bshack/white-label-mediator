name: Security checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test-build-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: node scripts/compatibility-cleanup.cjs
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm audit --audit-level=high

  sync-verified-changes:
    needs: test-build-audit
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: node scripts/compatibility-cleanup.cjs
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Persist verified changes
        shell: bash
        run: |
          git checkout origin/master -- .github/workflows/security.yml
          git rm scripts/compatibility-cleanup.cjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Drop obsolete mediator compatibility metadata"
          git push
      - run: git diff --exit-code -- package-lock.json dist

name: Publish package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Verify release tag is current default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH" --no-tags
          TAG_COMMIT="$(git rev-parse HEAD)"
          DEFAULT_COMMIT="$(git rev-parse "origin/$DEFAULT_BRANCH")"
          if [ "$TAG_COMMIT" != "$DEFAULT_COMMIT" ]; then
            echo "Release tag must point to the current $DEFAULT_BRANCH commit."
            echo "tag:     $TAG_COMMIT"
            echo "default: $DEFAULT_COMMIT"
            exit 1
          fi
      - name: Verify release tag matches package version
        run: |
          PACKAGE_VERSION="$(node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version")"
          if [ "$GITHUB_REF_NAME" != "v$PACKAGE_VERSION" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match package version v$PACKAGE_VERSION."
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run coverage
      - run: npm run audit
      - run: npm pack --dry-run
      - run: npm publish --provenance --access public

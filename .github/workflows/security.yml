name: Security checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test-build-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      # coverage builds (which typechecks), checks consumer types, and runs every Node test.
      - run: npm run coverage
      # Short Mediator benchmark against benchmark/baseline.json; fails only above 3x
      # the baseline (runner noise) or when the AbortSignal.any() counts change.
      - run: npm run bench:ci
      - run: npm run audit
      # dist/ was built by coverage; skip the prepare script's rebuild while packing.
      - run: npm pack --dry-run --ignore-scripts
      - name: Create packed package
        run: npm pack --silent --ignore-scripts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packed-package
          path: '*.tgz'
          if-no-files-found: error
          retention-days: 7

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      # Bundles the built package and runs the EventTarget checks in real Chromium.
      - run: npm run test:browser

  minimum-node-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.18.0
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test

  package-manager-compatibility:
    needs: test-build-audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package-manager: [npm, yarn, pnpm]
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.21.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: packed-package
          path: package
      - name: Configure package manager
        if: matrix.package-manager != 'npm'
        run: |
          corepack enable
          if [ "${{ matrix.package-manager }}" = "yarn" ]; then
            corepack prepare yarn@4.9.2 --activate
          else
            corepack prepare pnpm@10.17.1 --activate
          fi
      - name: Verify packed package
        env:
          # Resolve the installed entry point and prove it delivers a CustomEvent payload.
          CHECK: >-
            const Mediator = require('white-label-mediator');
            const mediator = new Mediator();
            let detail;
            mediator.addEventListener('ready', event => { detail = event.detail; });
            mediator.dispatchEvent(new CustomEvent('ready', {detail: 42}));
            if (typeof Mediator !== 'function' || detail !== 42) process.exit(1);
        run: |
          PACKAGE="$(realpath package/*.tgz)"
          TEMP="$(mktemp -d)"
          cd "$TEMP"
          printf '{"private":true}\n' > package.json
          case "${{ matrix.package-manager }}" in
            npm)
              npm install --ignore-scripts "$PACKAGE" >/dev/null
              node -e "$CHECK"
              ;;
            yarn)
              yarn add "$PACKAGE" >/dev/null
              yarn node -e "$CHECK"
              ;;
            pnpm)
              pnpm add --ignore-scripts "$PACKAGE" >/dev/null
              pnpm exec node -e "$CHECK"
              ;;
          esac

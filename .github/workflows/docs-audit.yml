name: Documentation audit

on:
  push:
    branches:
      - docs/audit-20260911

permissions:
  contents: write

jobs:
  audit-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: docs/audit-20260911
      - uses: actions/setup-node@v7
        with:
          node-version: 24.21.0
          cache: npm
      - name: Refresh documentation
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new))

          replace('AGENTS.md', 'Verified against `package.json`, `README.md`, and `.github/workflows/security.yml` on September 9, 2026.', 'Verified against `package.json`, `README.md`, and `.github/workflows/security.yml` on September 11, 2026.')
          replace('AGENTS.md', 'Use npm >=10.0 and Node.js `^22.18.0 || >=24.11.0`; CI uses Node 24.', 'Use npm >=11.0 and Node.js `^22.18.0 || >=24.11.0`; CI uses Node 24.')
          replace('AGENTS.md', 'npm ci --ignore-scripts\nnpm run typecheck', 'npm ci --ignore-scripts\nnpm run lint\nnpm run typecheck')
          replace('AGENTS.md', 'No dedicated lint or format script is defined in the reviewed manifest. Inspect existing configuration before adding tools; report unperformed checks accurately.', 'ESLint is configured through `eslint.config.mjs`; run `npm run lint` and treat warnings as failures. No dedicated formatter script is configured.')
          replace('AGENTS.md', 'preserve backward compatibility unless a breaking change is explicitly requested.\n\nIdentify unavoidable breaking changes before implementation.\n\nClearly document any required migration or compatibility considerations.', 'do not preserve backward compatibility through aliases, deprecated signatures, fallback code paths, adapters, or other compatibility shims. When the current contract requires an incompatible public change, implement the clean current API and communicate it with a Semantic Versioning major release and migration notes.\n\nIdentify breaking changes before implementation.\n\nClearly document required migration considerations.')
          replace('AGENTS.md', 'Database and schema changes must account for mixed-version deployments when applicable. Prefer backward-compatible, staged migrations. Document deployment ordering, rollback limitations, data backfills, locking risks, expected runtime impact, and recovery procedures.', 'Database and schema changes must prioritize safe deployment, data integrity, and recovery. Do not retain old application contracts solely for mixed-version compatibility unless an explicit deployment requirement demands it. Document deployment ordering, rollback limitations, data backfills, locking risks, expected runtime impact, and recovery procedures.')

          replace('README.md', 'npm ci\nnpm run build\nnpm run typecheck', 'npm ci\nnpm run build\nnpm run lint\nnpm run typecheck')
          replace('README.md', '### Verification and coverage\n\n## Tested compatibility\n\nVersion 3.1 is tested with model 3.x, view 4.x, and router 4.x. It retains the standard synchronous EventEmitter behavior.', '### Verification, coverage, and compatibility\n\nVersion 4.0.0 retains the standard synchronous EventEmitter behavior and has no runtime dependency on model, view, or router. Package tests cover the mediator public contract independently; consuming applications are responsible for integration testing the package versions they select.')
          replace('README.md', 'npm ci --ignore-scripts\nnpm run typecheck', 'npm ci --ignore-scripts\nnpm run lint\nnpm run typecheck')

          replace('docs/events-compatibility.md', 'The package-specific cases also cover lifecycle cleanup. Model/Collection cases cover mutation order, full-state payload identity, silent mutations, invalid Model updates, array/Map collections, and local/namespaced relay using each combination of the two event backends. State teardown must not unsubscribe unrelated mediator listeners.', 'The package-specific cases also cover Mediator lifecycle cleanup: `initialize()` chaining, named and symbol listeners, `destroy()` cleanup, and post-destroy emission behavior under both event backends.')
          replace('docs/events-compatibility.md', 'Clean locked installations reported zero known vulnerabilities. No dedicated lint or formatter is configured; whitespace checks passed.', 'Clean locked installations reported zero known vulnerabilities. At that date, no dedicated lint or formatter was configured; ESLint was added on September 11, 2026. Whitespace checks passed.')
          PY
      - name: Verify documentation references
        run: |
          ! grep -q 'npm >=10.0' AGENTS.md
          ! grep -q 'No dedicated lint or format script' AGENTS.md
          ! grep -q 'preserve backward compatibility unless' AGENTS.md
          ! grep -q 'Version 3.1 is tested' README.md
          ! grep -q 'Model/Collection cases cover' docs/events-compatibility.md
          grep -q 'npm run lint' AGENTS.md README.md
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run coverage
      - run: npm run audit
      - run: npm pack --dry-run
      - name: Commit documentation and remove temporary workflow
        run: |
          rm .github/workflows/docs-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh mediator documentation after tooling updates"
          git push
